name: stryde
description: A focused workout tracker with subtle progression mechanics.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  cupertino_icons: ^1.0.9
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  material_ui: ^1.1.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/exercises.json
    - assets/images/
