name: stryde
description: A focused workout tracker with subtle progression mechanics.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  audioplayers: ^6.8.1
  cupertino_icons: ^1.0.9
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  image_picker: ^1.2.4
  material_ui: ^1.1.0
  supabase_flutter: ^2.18.3

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

dependency_overrides:
  app_links: 6.4.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/exercises.json
    - assets/images/
    - assets/Visuals/images/
    - assets/sounds/
    - assets/icon/
